services:
  bot:
    build: .
    image: sfu-rock-club-bot
    restart: unless-stopped

    # Load secrets from a local .env file (never commit this file).
    # Copy .env.example to .env and fill in your values.
    env_file: .env

    environment:
      # Local SQLite in the mounted volume by default; overridden if TURSO_DATABASE_URL is set in .env
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/data/setlist.db}

    volumes:
      # Persist the local SQLite database between restarts.
      # Remove this if you use Turso cloud (TURSO_DATABASE_URL + TURSO_AUTH_TOKEN).
      - bot_sqlite_data:/data

volumes:
  bot_sqlite_data:
